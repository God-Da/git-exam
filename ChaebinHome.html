<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome 🐹</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Animate.css -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>

    <!-- 대문 전체 -->
    <main
        class="min-vh-100 bg-danger-subtle d-flex
               align-items-center justify-content-center position-relative overflow-hidden">

        <!-- 장식 -->
        <div class="position-absolute top-0 start-0 m-5 display-4
                    animate__animated animate__pulse animate__infinite">
            🌷
        </div>

        <div class="position-absolute top-0 end-0 m-5 display-4
                    animate__animated animate__swing animate__infinite">
            🎀
        </div>

        <div class="position-absolute bottom-0 start-0 m-5 display-4
                    animate__animated animate__bounce animate__infinite">
            🧸
        </div>

        <div class="position-absolute bottom-0 end-0 m-5 display-4
                    animate__animated animate__pulse animate__infinite">
            🌱
        </div>


        <!-- 메인 카드 -->
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7 col-md-9">

                    <div
                        class="card border-0 shadow-lg rounded-5
                               animate__animated animate__zoomIn">

                        <div class="card-body text-center p-5">

                            <!-- 작은 라벨 -->
                            <span
                                class="badge rounded-pill
                                       bg-danger-subtle text-danger
                                       border border-danger-subtle
                                       px-3 py-2 mb-4">

                                ✨ Welcome to my page ✨

                            </span>


                            <!-- 프로필 -->
                            <div class="mb-4">

                                <img
                                    src="asset/img/Hamster.jpg"
                                    alt="햄스터"
                                    width="190"
                                    height="190"
                                    class="rounded-circle
                                           border border-5 border-light
                                           shadow object-fit-cover
                                           animate__animated
                                           animate__bounceIn">

                            </div>


                            <p class="text-secondary mb-2">
                                🐹 Chaebin.zip
                            </p>

                            <h1 class="display-4 fw-bold mb-3">
                                안녕하세요!
                            </h1>

                            <h3 class="fw-normal mb-4">
                                채빈의 공간에 오신 걸 환영합니다 🌷
                            </h3>


                            <p class="text-secondary fs-5 mb-4">
                                코딩 💻 · 햄스터 🐹 · 인형뽑기 🧸
                            </p>


                            <!-- 한마디 -->
                            <div
                                class="alert alert-warning
                                       border-0 rounded-4 mb-4">

                                🌱 오늘도 열심히 성장 중입니다!

                            </div>


                            <!-- 입장 버튼 -->
                            <a
                                href="Chaebin.html"
                                class="btn btn-danger btn-lg
                                       rounded-pill px-5 shadow">

                                <i class="bi bi-door-open-fill"></i>
                                입장하기

                            </a>


                            <div class="mt-4">

                                <small class="text-secondary">
                                    Click to enter 🐾
                                </small>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
